<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frontend</title>
</head>

<body>
    <p>
        hello ahmed
    </p>
    <div id="courses-wrapper">
        <h1>all courses</h1>
    </div>
    <hr>
    <form id="course-details-form">
        <h1>Get course by id</h1>
        <div>
            <label for="input-id">id</label>
            <input type="text" name="input-details-id" id="input-details-id">
        </div>
        <div id="details-course">
            <h1>details course</h1>
        </div>
        <button type="submit">Get Course</button>
    </form>
    <hr>
    <form id="post-course-form">
        <h1>post course</h1>
        <div>
            <label for="input-title-course">title</label>
            <input required type="text" name="title" id="input-title">
        </div>
        <div>
            <label for="input-price-id">price</label>
            <input required type="text" name="price" id="input-price">
        </div>
        <div id="details-post-course">
            <h1>details post course</h1>
        </div>
        <button type="submit">post Course</button>
    </form>
    <script src="./main.js"></script>
</body>

</html>
